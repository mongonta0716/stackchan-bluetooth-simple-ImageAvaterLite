; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
default_envs = m5stack-core2

[env]
platform = espressif32 @ 6.12.0 ;6.4.0
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
board_build.f_flash = 80000000L
board_build.filesystem = spiffs
board_build.partitions = default_16MB.csv
build_flags = -DCORE_DEBUG_LEVEL=4
; WiFiに接続してTCP通知(ピンポン)を受け取りたい場合は、各[env]のbuild_flagsに
; -D USE_TCPNOTIFY を追加してください。(WiFi接続情報はSDカードの/yaml/SC_SecConfig.yamlに設定します。)
; M5Stack Core2で使用するとBluetooth+WiFi+FastLED(M5GoBottomのLED)でIRAMが不足しビルドできないため、
; USE_TCPNOTIFY指定時はM5GoBottomのLED演出(USE_LED)が自動的に無効化されます。
;
; WiFiを使わずUART(Serial1)経由で通知(ピンポン)を受け取りたい場合は、各[env]のbuild_flagsに
; -D USE_UARTNOTIFY を追加してください。(RxPin/TxPin/BaudrateはSDカードの
; /app/SCBluetooth/SC_AppConfig.xmlに設定します。)WiFi/Bluetoothの共存コードを使わないため
; IRAMをほとんど消費せず、USE_LEDと併用できます。USE_TCPNOTIFYとは併用しないでください。
;lib_extra_dirs = lib
lib_deps =
    ; M5StackImageAvatarはSDキャッシュ対応版をlib/M5StackImageAvatarに配置
    mongonta0716/stackchan-arduino@^0.0.7 ;
;    m5stack/M5UGFX
;    m5stack/M5Unified
    earlephilhower/ESP8266Audio @1.9.7
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.7.3
    ;https://github.com/pschatzmann/ESP32-A2DP.git
    FastLED/FastLED @ 3.6.0
;    tobozo/M5Stack-SD-Updater@

lib_ldf_mode = deep
;タカヲ専用のリモート開発用スクリプト
extra_scripts =
    post:scripts/copy_firmware.py

[env:m5stack-core2]
board = m5stack-core2
build_flags = ${env.build_flags}
    ; -D USE_TCPNOTIFY

[env:m5stack-grey]
; Flash16MBのBasicはこちらを使ってください。
board = m5stack-grey
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload_maximum_ram_size = 327680
build_flags = -DCORE_DEBUG_LEVEL=0
;build_flags = -DCORE_DEBUG_LEVEL=0 -D USE_TCPNOTIFY

[env:m5stack-fire]
; fireはespressif32最新版(5.x)で動かない場合は下記の1行をコメントアウトしてください。
;platform = espressif32 @ 4.4.0
board = m5stack-fire
;build_flags = ${env.build_flags} -D USE_TCPNOTIFY

[env:m5stack-core-esp32]
; Flash 16MBのBasicはm5stack-greyを使ってください。
board = m5stack-core-esp32
board_build.flash_mode = qio
build_flags = -DCORE_DEBUG_LEVEL=0
;build_flags = -DCORE_DEBUG_LEVEL=0 -D USE_TCPNOTIFY
; Flash 4MB
board_build.partitions = huge_app.csv

